version: '3.8'

# Production deployment: Redivue app + nginx HTTPS reverse proxy.
# Redis instances are NOT included — Redivue connects to your existing Redis servers.
#
# Quick start:
#   1. Generate certs:  bash deploy/generate-certs.sh          (self-signed, internal use)
#      OR copy Let's Encrypt certs to deploy/ssl/cert.pem and deploy/ssl/key.pem
#   2. Build & start:   docker compose -f deploy/docker-compose.prod.yml up -d
#   3. Open:            https://localhost  (or your server IP/domain)

services:
  redivue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: redivue-app
    expose:
      - "8080"
    networks:
      - redivue-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: redivue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - redivue
    networks:
      - redivue-net
    restart: unless-stopped

networks:
  redivue-net:
    driver: bridge

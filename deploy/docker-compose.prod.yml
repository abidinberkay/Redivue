# Production deployment: Redivue app + nginx HTTPS reverse proxy.
# Redis instances are NOT included — Redivue connects to your existing Redis servers.
#
# Quick start:
#   1. Generate certs:  bash deploy/generate-certs.sh          (self-signed, internal use)
#      OR copy Let's Encrypt certs to deploy/ssl/cert.pem and deploy/ssl/key.pem
#   2. Build & start:   REDIVUE_ALLOWED_HOSTS=your.domain.com docker compose -f deploy/docker-compose.prod.yml up -d
#   3. Open:            https://localhost  (or your server IP/domain)

services:
  redivue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: redivue-app
    environment:
      # Hostname(s) this deployment is served under, e.g. your domain or server IP.
      # Requests with any other Host header get a 403 (DNS-rebinding guard). See DEPLOYMENT.md.
      - REDIVUE_ALLOWED_HOSTS=${REDIVUE_ALLOWED_HOSTS:-}
    expose:
      - "8080"
    networks:
      - redivue-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: redivue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - redivue
    networks:
      - redivue-net
    restart: unless-stopped

networks:
  redivue-net:
    driver: bridge

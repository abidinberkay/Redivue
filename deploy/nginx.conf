events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Rate limiting zones (per client IP)
    # "bulk" zone: destructive ops (delete, copy, migrate) — max 10 req/min
    limit_req_zone $binary_remote_addr zone=bulk:10m rate=10r/m;
    # "api" zone:  all other API calls — max 60 req/s
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;

    limit_req_status 429;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # TLS 1.2+ only, modern cipher suite
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # Bulk/destructive operations — strictly rate limited
        location ~ ^/api/redis/[^/]+/bulk/ {
            limit_req zone=bulk burst=5 nodelay;

            proxy_pass         http://redivue:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options           DENY                                           always;
            add_header X-Content-Type-Options    nosniff                                        always;
            add_header Referrer-Policy           strict-origin-when-cross-origin                always;
        }

        # All other requests (UI, stats, keys, CLI, SSE streams)
        location / {
            limit_req zone=api burst=100 nodelay;

            proxy_pass         http://redivue:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Disable buffering — required for SSE (Monitor, Pub/Sub, Keyspace Notifications).
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options           DENY                                           always;
            add_header X-Content-Type-Options    nosniff                                        always;
            add_header Referrer-Policy           strict-origin-when-cross-origin                always;
            add_header X-Accel-Buffering         no                                             always;
        }
    }
}

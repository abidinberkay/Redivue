name: Feature request
description: Suggest something Redivue should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the feature name — helps us see if it's already covered another way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Redivue to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried as a workaround?
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before filing, it's worth a quick look at [FEATURES.md](https://github.com/abidinberkay/Redivue/blob/main/FEATURES.md) and [TODO.txt](https://github.com/abidinberkay/Redivue/blob/main/TODO.txt) — it might already be planned.
